{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Article{% endblock title %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/home.css' %}">
{% endblock extra_head %}

{% block content %}
<div class="delete-wrapper reveal">
    <div class="delete-card">
        <h1>حذف مقاله</h1>
        <p>مطمئنی می‌خوای «{{ article.title }}» رو حذف کنی؟ این کار قابل بازگشت نیست.</p>
        <form method="post" action="">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">بله، حذف کن</button>
            <a href="{% url 'article_list' %}" class="btn btn-ghost">انصراف</a>
        </form>
    </div>
</div>
{% endblock content %}
